name: Build Mobile iOS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile/ios/**', '.github/workflows/build-mobile-ios.yml']
  pull_request:
    paths: ['mobile/ios/**', '.github/workflows/build-mobile-ios.yml']
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode with installed simulator runtime
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer
      - name: Build simulator release
        run: bash mobile/ios/scripts/ios.sh release
      - name: Unit and UI tests
        run: bash mobile/ios/scripts/ios.sh test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: mobile/ios/DerivedData/Logs/Test/*.xcresult
          if-no-files-found: ignore
