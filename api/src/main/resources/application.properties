# Basic
spring.application.name=auth
server.port=8000
app.debug=${DEBUG:false}

# Mysql
spring.datasource.url=${DB_URL:}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false

# Redis
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=5000

# JWT
jwt.secret=${JWT_SECRET:ksuser-very-secret-key-2026-abc}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# SMTP
spring.mail.host=${MAIL_HOST:smtp.exmail.qq.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.fallback=false
spring.mail.default-encoding=UTF-8

# Log
logging.level.root=INFO
logging.level.cn.ksuser.api=DEBUG

# 速率限制配置（验证码发送）
app.rate-limit.send-code-email-per-minute=1
app.rate-limit.send-code-email-per-hour=14
# IP 仅作为共享网络的防刷兜底；个人发送频率由邮箱额度控制
app.rate-limit.send-code-ip-per-minute=60
app.rate-limit.send-code-ip-per-hour=600

# 速率限制配置（密码登录）
app.rate-limit.login-email-per-minute=5
app.rate-limit.login-email-per-hour=60
app.rate-limit.login-ip-per-minute=10
app.rate-limit.login-ip-per-hour=120

# 密码策略
app.password.min-length=6
app.password.max-length=66
app.password.require-uppercase=false
app.password.require-lowercase=false
app.password.require-digits=true
app.password.require-special-chars=false

# Token 配置
app.token.blacklist-enabled=true
app.token.refresh-rotation-enabled=true

# 敏感操作配置
app.sensitive-operation.verification-duration-minutes=15
app.sensitive-operation.require-ip-match=true

# 安全 Header
server.servlet.session.cookie.http-only=true
## 开发环境跨域 HTTP 使用 Lax，前后端跨域但在同一本地机器
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
server.forward-headers-strategy=framework

# 请求大小限制
server.tomcat.max-http-form-post-size=4194304
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB

app.qq.oauth.app-id=${QQ_OAUTH_APP_ID:}
app.qq.oauth.app-key=${QQ_OAUTH_APP_KEY:}
app.qq.oauth.redirect-uris[0]=https://auth.ksuser.cn/oauth/qq/callback
app.qq.mobile.app-id=${QQ_MOBILE_APP_ID:${QQ_OAUTH_APP_ID:}}
app.qq.mobile.app-key=${QQ_MOBILE_APP_SECRET:${QQ_OAUTH_APP_KEY:}}

# GitHub OAuth 配置
app.github.oauth.app-id=${GITHUB_OAUTH_CLIENT_ID:}
app.github.oauth.app-key=${GITHUB_OAUTH_CLIENT_SECRET:}
app.github.oauth.redirect-uris[0]=https://auth.ksuser.cn/oauth/github/callback

# Microsoft OAuth 配置
app.microsoft.oauth.app-id=${MICROSOFT_OAUTH_CLIENT_ID:}
app.microsoft.oauth.app-key=${MICROSOFT_OAUTH_CLIENT_SECRET:}
app.microsoft.oauth.tenant-id=${MICROSOFT_OAUTH_TENANT_ID:consumers}
app.microsoft.oauth.redirect-uris[0]=https://auth.ksuser.cn/oauth/microsoft/callback

# Google OAuth 配置
app.google.oauth.app-id=${GOOGLE_OAUTH_CLIENT_ID:}
app.google.oauth.app-key=${GOOGLE_OAUTH_CLIENT_SECRET:}
app.google.oauth.redirect-uris[0]=https://auth.ksuser.cn/oauth/google/callback

# Open Platform OAuth2 配置
app.oauth2.max-apps-per-user=5
app.oauth2.authorization-code-expiration-seconds=300
app.oauth2.access-token-expiration-seconds=7200

# Mobile bridge 配置
app.mobile-bridge.app-link-origin=${APP_MOBILE_BRIDGE_APP_LINK_ORIGIN:https://auth.ksuser.cn}
app.mobile-bridge.allowed-return-origins=${APP_MOBILE_BRIDGE_ALLOWED_RETURN_ORIGINS:http://localhost:5173,https://auth.ksuser.cn,https://www.ksuser.cn}

# Enable only after API, Web/AASA and the iOS App have been deployed together.
app.native-authorization.enabled=${APP_NATIVE_AUTHORIZATION_ENABLED:false}
app.native-authorization.allowed-client-ids=${APP_NATIVE_AUTHORIZATION_ALLOWED_CLIENT_IDS:}
app.native-authorization.create-ip-per-minute=${APP_NATIVE_AUTHORIZATION_CREATE_IP_PER_MINUTE:30}
app.native-authorization.create-client-per-minute=${APP_NATIVE_AUTHORIZATION_CREATE_CLIENT_PER_MINUTE:120}

app.oidc.issuer=${APP_OIDC_ISSUER:http://localhost:8000}
app.oidc.rsa.private-key-pem=${APP_OIDC_RSA_PRIVATE_KEY_PEM:}

# Passkey (WebAuthn) 配置
app.passkey.rp-name=Ksuser Auth
app.passkey.rp-id=${PASSKEY_RP_ID:localhost}
app.passkey.origin=${PASSKEY_ORIGIN:http://localhost:5173}
app.passkey.android-origins=${PASSKEY_ANDROID_ORIGINS:}
# Exact origins returned by signed HarmonyOS clients; no inferred origins or wildcards.
app.passkey.harmony-origins=${PASSKEY_HARMONY_ORIGINS:}
app.passkey.android-cert-sha256-fingerprints=${PASSKEY_ANDROID_CERT_SHA256_FINGERPRINTS:}
app.passkey.attestation=none
app.passkey.user-verification=preferred
app.passkey.resident-key=preferred
app.passkey.timeout=300000
# TOTP 加密配置
# 主加密密钥（用于加密 TOTP 密钥）
# 32 字节（256 位）的 Base64 编码密钥
# 建议在生产环境中从环境变量读取：ENCRYPTION_MASTER_KEY
app.encryption.master-key=${ENCRYPTION_MASTER_KEY:hXYmuT9xcqx4HZfF0DWadMiRB+jvLW7ZR0fUTPFkxuk=}

# Native Sign in with Apple (disabled until all values and explicit encryption key are set)
app.apple.client-ids=${APPLE_CLIENT_IDS:}
app.apple.team-id=${APPLE_TEAM_ID:}
app.apple.key-id=${APPLE_KEY_ID:}
app.apple.private-key-pem=${APPLE_PRIVATE_KEY_PEM:}
app.apple.credential-encryption-key=${APPLE_CREDENTIAL_ENCRYPTION_KEY:${ENCRYPTION_MASTER_KEY:}}
app.apple.revocation-retry-delay-ms=60000
app.qq.mobile.allowed-app-ids=${QQ_MOBILE_ALLOWED_APP_IDS:}

# iOS APNs security notifications. Keep the .p8 provider key on the server only.
app.apns.enabled=${APNS_ENABLED:false}
app.apns.team-id=${APNS_TEAM_ID:}
app.apns.sandbox-key-id=${APNS_SANDBOX_KEY_ID:}
app.apns.sandbox-private-key-path=${APNS_SANDBOX_PRIVATE_KEY_PATH:}
app.apns.production-key-id=${APNS_PRODUCTION_KEY_ID:}
app.apns.production-private-key-path=${APNS_PRODUCTION_PRIVATE_KEY_PATH:}
# Compatibility with a legacy APNs key whose Apple configuration is allowed in both environments.
app.apns.key-id=${APNS_KEY_ID:}
app.apns.private-key-path=${APNS_PRIVATE_KEY_PATH:}
app.apns.topic=${APNS_TOPIC:cn.ksuser.auth}
app.apns.abnormal-risk-threshold=${APNS_ABNORMAL_RISK_THRESHOLD:40}

# Official applications and Console (existing API hosts both registries and Console sessions)
app.official.issuer=${APP_OFFICIAL_ISSUER:https://api.ksuser.cn/official}
app.official.authorization-url=${APP_OFFICIAL_AUTHORIZATION_URL:https://auth.ksuser.cn/official/authorize}
app.console.origin=${APP_CONSOLE_ORIGIN:}
app.console.passport-origin=${APP_CONSOLE_PASSPORT_ORIGIN:}
